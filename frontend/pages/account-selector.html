<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- CSP centralizada nos headers do host (vercel.json / firebase.json).
         Mantida apenas a diretiva upgrade-insecure-requests, igual às demais
         páginas, para evitar políticas divergentes duplicadas por página. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Login RH</title>
    <link rel="icon" type="image/png" href="../assets/logo-normatel.png">
    <link rel="stylesheet" href="../styles/styles.css" />
</head>
<body>
    <header class="top-header">
        <div class="container header-content">
            <img src="../assets/logo-normatel.png" alt="Normatel Engenharia" class="logo-normatel" />
        </div>
    </header>

    <main class="container main-content login-main">
        <section class="card login-card account-selector-card">
            <h1>Login RH</h1>
            <p class="page-subtitle">Entre com sua conta Microsoft para acessar os atestados e declarações.</p>
            
            <div class="account-button-group">
                <button id="loginBtn" class="microsoft-login-btn login-main-btn ms-auth-btn ms-auth-btn-primary">
                    <span class="ms-icon">
                        <span class="ms-sq ms-red"></span>
                        <span class="ms-sq ms-green"></span>
                        <span class="ms-sq ms-blue"></span>
                        <span class="ms-sq ms-yellow"></span>
                    </span>
                    <span>Entrar com Microsoft</span>
                </button>
                
                <p class="login-register-text">Não é cadastrado?</p>
                
                <button id="registerBtn" class="rh-access-btn login-main-btn ms-auth-btn ms-auth-btn-secondary">
                    <span class="ms-icon">
                        <span class="ms-sq ms-red"></span>
                        <span class="ms-sq ms-green"></span>
                        <span class="ms-sq ms-blue"></span>
                        <span class="ms-sq ms-yellow"></span>
                    </span>
                    <span>Cadastrar com Microsoft</span>
                </button>
            </div>
            
            <p id="statusMessage" class="status-message status-toast" role="status" aria-live="polite"></p>
            <div id="userInfo" class="account-user-info hidden">
                Usuário logado: <strong id="loggedUserName"></strong>
                <button id="logoutBtn" class="rh-logout-btn" onclick="sairConta()">Sair</button>
            </div>
            
            <a href="index.html" class="success-link login-back-link">Voltar para a página principal</a>
        </section>
    </main>

    <!-- MSAL.js - Microsoft Authentication Library (local para evitar bloqueio de Tracking Prevention) -->
    <script src="../assets/vendor/msal-browser.min.js"></script>
    
    <!-- Firebase Auth (compat) para cadastro direto no Authentication -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="../scripts/firebase-config.js?v=20260305a"></script>
    <script src="../scripts/msal-config.js?v=20260803b"></script>

    <!-- Script para gerenciar seleção de conta -->
    <script>
        // Initialize MSAL and Firebase
        let msalInstance = null;
        let msalReady = false;
        let firebaseAuthInstance = null;
        const AUTH_STEP_TIMEOUT_MS = 20000;
        
        // MSAL Configuration é fornecida por msal-config.js via window.msalConfig
        // (não redeclarar aqui para evitar colisão de const no escopo global).
        console.log('account-selector: msalConfig', window.msalConfig);
        
        function definirMensagem(texto, tipo = 'loading') {
            const el = document.getElementById('statusMessage');
            if (window.statusMessageTimer) { clearTimeout(window.statusMessageTimer); }
            el.textContent = texto;
            el.className = 'status-message status-toast';
            if (tipo === 'success') el.classList.add('status-message--success');
            else if (tipo === 'error') el.classList.add('status-message--error');
            else el.classList.add('status-message--info');
            
            if (tipo === 'success' || tipo === 'info') {
                window.statusMessageTimer = setTimeout(() => {
                    el.textContent = '';
                    el.className = 'status-message status-toast';
                    window.statusMessageTimer = null;
                }, 4000);
            }
        }
        
        function limparMensagem() {
            const el = document.getElementById('statusMessage');
            if (window.statusMessageTimer) { clearTimeout(window.statusMessageTimer); }
            el.textContent = '';
            el.className = 'status-message status-toast';
        }
        
        function definirBotoesAuthHabilitados(habilitado) {
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            if (loginBtn) loginBtn.disabled = !habilitado;
            if (registerBtn) registerBtn.disabled = !habilitado;
        }
        
        async function comTimeout(promise, etapa, timeoutMs = 20000) {
            let timerId;
            try {
                return await Promise.race([
                    promise,
                    new Promise((_, reject) => { timerId = setTimeout(() => reject(new Error(`TIMEOUT_${etapa}`)), timeoutMs); })
                ]);
            } finally { if (timerId) clearTimeout(timerId); }
        }
        
        async function registrarEventoBackend(acao, detalhes = {}) {
            if (typeof firebase !== 'undefined') {
                try { await firebase.firestore().collection('eventos_frontend').add({ acao, pagina: 'account-selector.html', email: localStorage.getItem('rh_user_email') || '', usuarioId: localStorage.getItem('rh_user_id') || '', detalhes, criado_em: new Date().toISOString() }); } catch {}
            }
        }
        
        async function verificarSessaoExistente() {
            const token = localStorage.getItem('rh_auth_token');
            const email = localStorage.getItem('rh_user_email');
            const nome = localStorage.getItem('rh_user_nome');
            const pendente = localStorage.getItem('rh_user_pendente') === 'true';
            
            if (pendente) { definirMensagem('⏳ Seu cadastro está pendente de aprovação.', 'loading'); document.getElementById('userInfo').classList.add('hidden'); return false; }
            if (token && email) { document.getElementById('loggedUserName').textContent = nome || email; document.getElementById('userInfo').classList.remove('hidden'); return true; }
            return false;
        }
        
        async function verificarUsuarioCadastrado(email) {
            // Primeiro tenta usar Firebase Auth (se disponível e autenticado)
            if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                try {
                    const snap = await firebase.firestore().collection('usuarios_rh').where('email', '==', email).limit(1).get();
                    if (!snap.empty) {
                        const data = snap.docs[0].data();
                        return { existe: true, aprovado: data.aprovado === true || String(data.status || '').toLowerCase() === 'aprovado' };
                    }
                    return { existe: false, aprovado: false };
                } catch (e) { /* cai para backend */ }
            }
            return await verificarUsuarioCadastradoNoBackend(email);
        }
        
        function erroPermissaoFirestore(erro) {
            const texto = `${erro?.code || ''} ${erro?.message || ''}`.toLowerCase();
            return texto.includes('permission-denied') || texto.includes('missing or insufficient permissions');
        }
        
        async function requisicaoBackendJson(url, options = {}, tentativas = 2) {
            if (!window.BACKEND_URL) throw new Error('BACKEND_URL_NOT_CONFIGURED');
            let ultimaResposta = null;
            for (let i = 0; i <= tentativas; i += 1) {
                let resposta;
                try { resposta = await fetch(url, options); } catch { if (i === tentativas) throw new Error('BACKEND_UNREACHABLE'); await new Promise(r => setTimeout(r, 250 * (i + 1))); continue; }
                ultimaResposta = resposta;
                if (resposta.ok) return await resposta.json();
                const statusRepetivel = resposta.status === 429 || resposta.status >= 500;
                if (!statusRepetivel || i === tentativas) {
                    let detalhe = '';
                    try { const body = await resposta.json(); detalhe = body?.error || body?.mensagem || ''; } catch { detalhe = await resposta.text().catch(() => ''); }
                    throw new Error(`${resposta.status}${detalhe}`);
                }
                await new Promise(r => setTimeout(r, 250 * (i + 1)));
            }
            throw new Error(`${ultimaResposta?.status || 'BACKEND_ERROR'}`);
        }
        
        async function verificarUsuarioCadastradoNoBackend(email) {
            const params = new URLSearchParams();
            params.set('email', String(email || '').trim().toLowerCase());
            const data = await requisicaoBackendJson(`${window.BACKEND_URL}/api/usuarios/existe?${params.toString()}`);
            return { existe: !!data?.existe, aprovado: !!data?.aprovado };
        }
        
        async function cadastrarUsuarioNoBackend(email, nome) {
            const data = await requisicaoBackendJson(`${window.BACKEND_URL}/api/usuarios`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: String(email || '').trim().toLowerCase(), nome: String(nome || '').trim() }) });
            return { status: data?.status === 'aprovado' ? 'aprovado' : 'pendente' };
        }
        
        async function verificarUsuarioCadastradoComFallback(email) {
            try { return await verificarUsuarioCadastrado(email); } catch (erro) {
                if (!erroPermissaoFirestore(erro)) throw erro;
                try { return await verificarUsuarioCadastradoNoBackend(email); } catch (erroBackend) {
                    if (String(erroBackend?.message || '').includes('BACKEND_URL_NOT_CONFIGURED')) throw new Error('FIRESTORE_PERMISSION_DENIED_LOGIN_CHECK');
                    throw erroBackend;
                }
            }
        }
        
        async function cadastrarUsuario(email, nome) {
            if (typeof firebase === 'undefined') return await cadastrarUsuarioNoBackend(email, nome);
            try {
                const snap = await firebase.firestore().collection('usuarios_rh').where('email', '==', email).get();
                if (!snap.empty) {
                    const docRef = snap.docs[0].ref;
                    const docData = snap.docs[0].data() || {};
                    const statusAtual = String(docData.status || '').toLowerCase();
                    const aprovadoAtual = docData.aprovado === true || statusAtual === 'aprovado';
                    if (!aprovadoAtual) {
                        await docRef.set({ email, nome, status: 'pendente', aprovado: false, atualizado_em: new Date().toISOString() }, { merge: true });
                        return { status: 'pendente' };
                    }
                    return { status: 'aprovado' };
                }
                await firebase.firestore().collection('usuarios_rh').add({ email, nome, status: 'pendente', aprovado: false, criado_em: new Date().toISOString() });
                return { status: 'pendente' };
            } catch (erro) {
                if (!erroPermissaoFirestore(erro)) throw erro;
                return await cadastrarUsuarioNoBackend(email, nome);
            }
        }
        
        function marcarCadastroPendente(email, nome) {
            localStorage.removeItem('rh_auth_token');
            localStorage.removeItem('rh_user_id');
            localStorage.setItem('rh_user_email', email || '');
            localStorage.setItem('rh_user_nome', nome || email || '');
            localStorage.setItem('rh_user_pendente', 'true');
            document.getElementById('userInfo').style.display = 'none';
        }
        
        async function ativarFirebaseAuthComTokenMsal(loginResponse) {
            try {
                const auth = await inicializarFirebaseAuth();
                const provider = new firebase.auth.OAuthProvider('microsoft.com');
                const credential = provider.credential({ accessToken: loginResponse?.accessToken || '', idToken: loginResponse?.idToken || '' });
                await auth.signInWithCredential(credential);
                // Aguardar auth state ficar pronto
                await new Promise(resolve => {
                    const unsubscribe = auth.onAuthStateChanged(user => {
                        unsubscribe();
                        resolve(user);
                    });
                });
            } catch (err) { console.warn('[Firebase Auth] Sessão não estabelecida:', err.message); }
        }
        
        function salvarSessao(account, token, origem = 'login') {
            localStorage.setItem('rh_auth_token', token);
            localStorage.setItem('rh_user_id', account.localAccountId);
            localStorage.setItem('rh_user_email', account.username);
            localStorage.setItem('rh_user_nome', account.name || account.username);
            localStorage.setItem('rh_user_pendente', 'false');
            registrarEventoBackend('sessao_salva', { origem, email: account.username, usuarioId: account.localAccountId, nome: account.name || account.username });
            document.getElementById('loggedUserName').textContent = account.name || account.username;
            document.getElementById('userInfo').style.display = 'block';
        }
        
        const REDIRECT_AFTER_LOGIN = localStorage.getItem('rh_redirect_after_login') || 'rh-atestados.html';
        
        function resolverBackendUrl() {
            const configurado = String(localStorage.getItem('rh_backend_url') || '').trim();
            if (configurado) {
                try {
                    const url = new URL(configurado);
                    return url.toString().replace(/\/+$|$/, '');
                } catch {
                    return configurado.replace(/\/+$|$/, '');
                }
            }
            if (['localhost', '127.0.0.1'].includes(window.location.hostname)) {
                return 'http://localhost:3001';
            }
            // Backend Cloud Functions Gen2 / Cloud Run (normatel-rh,
            // southamerica-east1). Faz o login funcionar sem config manual.
            return 'https://api-vgqcbmomea-rj.a.run.app';
        }

        window.BACKEND_URL = window.BACKEND_URL || resolverBackendUrl();
        
        async function inicializarFirebaseAuth() {
            if (typeof firebase === 'undefined') throw new Error('FIREBASE_NOT_LOADED');
            if (!firebase.apps || firebase.apps.length === 0) throw new Error('FIREBASE_APP_NOT_INITIALIZED');
            return firebase.auth();
        }

        function obterTokenValidoMsal(account, loginResponse) {
            if (loginResponse && loginResponse.idToken) return loginResponse.idToken;
            if (loginResponse && loginResponse.accessToken) return loginResponse.accessToken;
            if (account && account.idToken) return account.idToken;
            return null;
        }

        async function cadastrarNoFirebaseComPopup() {
            if (!msalInstance) throw new Error('MSAL_NOT_READY');
            const response = await comTimeout(msalInstance.loginPopup(window.loginRequest || { scopes: ["openid", "profile", "email"] }), 'MSAL_POPUP_CADASTRO');
            const account = response?.account || msalInstance.getActiveAccount() || (msalInstance.getAllAccounts()[0] || null);
            const token = await obterTokenValidoMsal(account, response);
            return { account, token, loginResponse: response };
        }

        async function processarRetornoConsultaFirebase() {
            return false;
        }

        async function processarRetornoCadastroFirebase() {
            return false;
        }

        async function orientarLoginParaUsuarioJaAprovado(email, nome) {
            definirMensagem('✅ Cadastro aprovado. Agora faça login com sua conta Microsoft.', 'success');
            return;
        }

        async function sincronizarRoleParaLocalStorage(email) {
            try {
                if (typeof firebase === 'undefined') return;
                const snap = await firebase.firestore().collection('usuarios_rh').where('email', '==', String(email || '').toLowerCase().trim()).limit(1).get();
                if (!snap.empty) {
                    const role = String(snap.docs[0].data().role || 'colaborador').toLowerCase().trim();
                    localStorage.setItem('rh_user_role', role === 'admin' ? 'admin' : 'colaborador');
                }
            } catch (_) { /* silently ignore */ }
        }
        
        async function sairConta() {
            try {
                if (msalInstance) {
                    const contaAtual = msalInstance.getActiveAccount() || (msalInstance.getAllAccounts()[0] || null);
                    if (contaAtual) await msalInstance.logoutPopup({ account: contaAtual });
                }
                const emailAtual = localStorage.getItem('rh_user_email') || '';
                ['rh_auth_token','rh_user_id','rh_user_email','rh_user_nome','rh_user_pendente','rh_user_role'].forEach(k => localStorage.removeItem(k));
                if (typeof firebase !== 'undefined' && firebase.apps?.length > 0) { await firebase.auth().signOut(); }
                registrarEventoBackend('logout', { email: emailAtual });
                document.getElementById('userInfo').classList.add('hidden');
                definirMensagem('✅ Sessão encerrada com sucesso.', 'success');
            } catch (e) { console.error('Erro ao sair:', e); }
        }
        
        async function processarRetornoLoginMicrosoft() {
            if (!msalInstance || !msalReady) return false;
            const loginResponse = await comTimeout(msalInstance.handleRedirectPromise(), 'MSAL_REDIRECT', 12000);
            const haviaLoginPendente = sessionStorage.getItem('msal_pending_login') === '1';
            const modoPendente = sessionStorage.getItem('msal_pending_mode') || 'login';
            if (!loginResponse && !haviaLoginPendente) return false;
            sessionStorage.removeItem('msal_pending_login'); sessionStorage.removeItem('msal_pending_mode');
            const account = loginResponse?.account || msalInstance.getActiveAccount() || (msalInstance.getAllAccounts()[0] || null);
            if (!account) { if (haviaLoginPendente) { definirMensagem('❌ Não foi possível concluir o retorno do login Microsoft.', 'error'); definirBotoesAuthHabilitados(true); } return false; }
            const token = await obterTokenValidoMsal(account, loginResponse);
            const email = (account.username || '').toLowerCase();
            const nome = account.name || account.username;
            if (!email) throw new Error('Não foi possível identificar o email da conta Microsoft.');
            if (modoPendente !== 'login') return false;
            if (!token) { definirMensagem('❌ Login Microsoft retornou sem token válido.', 'error'); definirBotoesAuthHabilitados(true); return true; }
if (msalInstance) msalInstance.setActiveAccount(account);
            definirMensagem(`✅ Login bem-sucedido como ${nome}`, 'success');
            salvarSessao(account, token, 'login_microsoft');
            await ativarFirebaseAuthComTokenMsal(loginResponse);
            await sincronizarRoleParaLocalStorage(email);
            const verificacao = await comTimeout(verificarUsuarioCadastradoComFallback(email), 'VERIFICACAO_USUARIO', 12000);
            if (!verificacao.existe) { definirMensagem('⚠️ Primeiro acesso detectado. Clique em "Cadastrar com Microsoft" para continuar.', 'error'); document.getElementById('loginBtn').disabled = false; document.getElementById('registerBtn').disabled = false; return true; }
            if (!verificacao.aprovado) { marcarCadastroPendente(email, nome); definirMensagem('⏳ Seu cadastro ainda está pendente de aprovação.', 'loading'); document.getElementById('loginBtn').disabled = false; document.getElementById('registerBtn').disabled = false; return true; }
            setTimeout(() => { window.location.href = REDIRECT_AFTER_LOGIN; localStorage.removeItem('rh_redirect_after_login'); }, 1500);
            return true;
        }
        
        // Guarda de reentrada: impede disparar uma segunda interação MSAL
        // enquanto a primeira (popup/redirect) ainda está aberta. Sem isso, um
        // segundo clique/chamada lança BrowserAuthError: interaction_in_progress.
        let interacaoMsalEmAndamento = false;

        async function fazerLoginMicrosoft(modo = 'login') {
            console.log('account-selector: fazerLoginMicrosoft called', modo, { msalReady, msalInstance, msalConfig: window.msalConfig });
            if (interacaoMsalEmAndamento) {
                console.warn('account-selector: interação MSAL já em andamento — clique ignorado.');
                return;
            }
            interacaoMsalEmAndamento = true;
            let iniciouRedirecionamento = false;
            try {
                definirMensagem('🔄 Redirecionando para Microsoft...', 'loading');
                definirBotoesAuthHabilitados(false);
                // Limpa qualquer interação MSAL pendente de uma tentativa anterior
                // que ficou presa (popup fechado sem concluir). Sem isso, o próximo
                // loginPopup lança interaction_in_progress.
                if (msalInstance && msalReady) {
                    try { await msalInstance.handleRedirectPromise(); } catch (_) { /* estado limpo abaixo */ }
                }
                if (modo === 'cadastro') {
                    const resultadoCadastroFirebase = await comTimeout(cadastrarNoFirebaseComPopup(), 'FIREBASE_POPUP_CADASTRO');
                    if (!resultadoCadastroFirebase) { iniciouRedirecionamento = true; return; }
                    const account = resultadoCadastroFirebase.account;
                    const token = resultadoCadastroFirebase.token;
                    const email = (account.username || '').toLowerCase();
                    const nome = account.name || account.username;
                    const cadastro = await cadastrarUsuario(email, nome);
                    if (cadastro?.status === 'aprovado') { await orientarLoginParaUsuarioJaAprovado(email, nome); return; }
                    marcarCadastroPendente(email, nome);
                    definirMensagem('⏳ Cadastro realizado com sucesso, mas está pendente de aprovação.', 'loading');
                    return;
                }
                if (!msalInstance || !msalReady) { definirMensagem('❌ MSAL.js não carregou. Atualize a página.', 'error'); definirBotoesAuthHabilitados(true); return; }
                const request = window.loginRequest || { scopes: ["openid", "profile", "email"] };
                let loginResponse;
                try { loginResponse = await comTimeout(msalInstance.loginPopup(request), 'MSAL_POPUP_LOGIN'); } catch (erroPopupMsal) {
                    if (deveUsarRedirectNoMsal(erroPopupMsal)) {
                        // Fallback correto: redirect de verdade NA MESMA ABA via
                        // MSAL (troca window.location internamente). NÃO usa
                        // window.open — abrir nova janela era o que causava o loop.
                        sessionStorage.setItem('msal_pending_login', '1');
                        sessionStorage.setItem('msal_pending_mode', modo);
                        definirMensagem('🔄 Redirecionando para o login da Microsoft (popup bloqueado)...', 'loading');
                        iniciouRedirecionamento = true;
                        await msalInstance.loginRedirect(request);
                        return;
                    }
                    throw erroPopupMsal;
                }
                const account = loginResponse.account;
                const token = await obterTokenValidoMsal(account, loginResponse);
                const email = (account.username || '').toLowerCase();
                const nome = account.name || account.username;
                if (msalInstance) msalInstance.setActiveAccount(account);
                if (!email) throw new Error('Não foi possível identificar o email da conta Microsoft.');
                if (!token) throw new Error('MSAL_TOKEN_MISSING');
                if (msalInstance) msalInstance.setActiveAccount(account);
                if (modo === 'login') {
                    await ativarFirebaseAuthComTokenMsal(loginResponse);
                    await sincronizarRoleParaLocalStorage(email);
                    const verificacao = await comTimeout(verificarUsuarioCadastradoComFallback(email), 'VERIFICACAO_USUARIO', 12000);
                    if (!verificacao.existe) { definirMensagem('⚠️ Primeiro acesso detectado. Clique em "Cadastrar com Microsoft" para continuar.', 'error'); definirBotoesAuthHabilitados(true); return; }
                    if (!verificacao.aprovado) { marcarCadastroPendente(email, nome); definirMensagem('⏳ Seu cadastro ainda está pendente de aprovação.', 'loading'); definirBotoesAuthHabilitados(true); return; }
                    definirMensagem(`✅ Login bem-sucedido como ${nome}`, 'success');
                }
                salvarSessao(account, token, 'login_microsoft');
                setTimeout(() => { window.location.href = REDIRECT_AFTER_LOGIN; localStorage.removeItem('rh_redirect_after_login'); }, 1500);
                iniciouRedirecionamento = true;
                return;
            } catch (error) {
                if (String(error?.message || '').includes('FIREBASE_REDIRECT_STARTED')) { iniciouRedirecionamento = true; return; }
                console.error('❌ Erro no login Microsoft:', error);
                let mensagemErro = `❌ Erro ao fazer login: ${error.message}`;
                const erroTexto = `${error.errorCode || ''} ${error.message || ''}`.toLowerCase();
                if (erroTexto.includes('aadsts50011')) mensagemErro = `❌ Redirect URI não cadastrada no Azure. Cadastre: ${window.msalConfig?.auth?.redirectUri || ''}`;
                else if (erroTexto.includes('aadsts9002326')) mensagemErro = '❌ Azure bloqueou login cross-origin. Adicione a plataforma SPA com URI http://localhost:5500/account-selector.html.';
                else if (erroTexto.includes('application') && erroTexto.includes('not found')) mensagemErro = '❌ App Registration não encontrado. Verifique Client ID e Tenant ID.';
                else if (erroTexto.includes('invalid_client')) mensagemErro = '❌ Client ID inválido para este App Registration.';
                else if (erroTexto.includes('firebase_api_key_missing')) mensagemErro = '❌ Falta configurar API key do Firebase: localStorage.setItem("rh_firebase_api_key","SUA_API_KEY") e recarregue.';
                else if (erroTexto.includes('backend_url_not_configured')) mensagemErro = `❌ Backend não configurado. Defina: localStorage.setItem("rh_backend_url","https://SUA-API") e recarregue.`;
                else if (erroTexto.includes('backend_unreachable')) mensagemErro = `❌ Não foi possível conectar ao backend (${BACKEND_URL || 'não definido'}). Verifique se a API está publicada.`;
                else if (erroTexto.includes('failed to fetch') || erroTexto.includes('cors')) mensagemErro = '❌ Firebase bloqueado por CORS. Configure API key local: localStorage.setItem("rh_firebase_api_key","SUA_API_KEY") e recarregue.';
                else if (erroTexto.includes('missing or insufficient permissions') || erroTexto.includes('permission-denied')) mensagemErro = '❌ Sem permissão no Firestore. Publique as regras: firebase deploy --only firestore:rules';
                else if (erroTexto.includes('invalid_credential_or_provider_id')) mensagemErro = '❌ Firebase rejeitou credencial Microsoft. Verifique Client ID/Secret no Firebase.';
                else if (erroTexto.includes('unknown_firebase_error') || erroTexto.includes('operation_not_allowed')) mensagemErro = '❌ Provedor Microsoft não está habilitado no Firebase Authentication.';
                else if (erroTexto.includes('timeout_')) mensagemErro = '❌ O login demorou além do esperado. Tente novamente; se persistir, limpe cache/cookies.';
                else if (erroTexto.includes('msal_token_missing')) mensagemErro = '❌ A Microsoft autenticou, mas não retornou token. Tente novamente e permita cookies/pop-up.';
                else if (erroTexto.includes('firestore_permission_denied_login_check')) mensagemErro = '❌ Login Microsoft concluído, mas o Firestore negou a leitura de usuarios_rh. Publique as regras no Firebase Console.';
                else if (erroTexto.includes('firebase_popup_blocked_register')) mensagemErro = '❌ O navegador bloqueou o popup de cadastro. Permita pop-ups e tente novamente.';
                else if (erroTexto.includes('interaction_in_progress')) mensagemErro = '❌ Havia um login em andamento. Aguarde um instante e tente novamente.';
                else mensagemErro = `❌ Erro ao fazer login: ${error.message}`;
                definirMensagem(mensagemErro, 'error');
                definirBotoesAuthHabilitados(true);
            } finally {
                // Só libera a guarda quando NÃO iniciou redirect. No redirect a
                // página recarrega e a flag é reinicializada naturalmente; liberar
                // aqui reabriria a janela para uma segunda interação em conflito.
                if (!iniciouRedirecionamento) {
                    interacaoMsalEmAndamento = false;
                    definirBotoesAuthHabilitados(true);
                }
            }
        }
        
        async function aplicarRestricaoCadastroParaAprovado(email) {
            try {
                const verificacao = await verificarUsuarioCadastradoComFallback(String(email || '').toLowerCase().trim());
                if (verificacao?.aprovado) {
                    const registerBtn = document.getElementById('registerBtn');
                    if (registerBtn) registerBtn.disabled = true;
                }
            } catch (_) { /* silently ignore */ }
        }

        // Detecta se esta página está sendo carregada DENTRO do popup de auth do
        // MSAL (redirectUri = a própria página). Nesse caso o MSAL do popup
        // captura o hash e fecha a janela sozinho — NÃO devemos rodar a init da
        // app aqui, senão a página reinicia dentro do popup, atrapalha a captura
        // do hash e o popup fecha antes da hora (monitorPopupForHash - window
        // closed), gerando o loop de janelas.
        function estaDentroDoPopupMsal() {
            try {
                if (!window.opener || window.opener === window) return false;
                const hash = String(window.location.hash || '');
                return hash.includes('code=') || hash.includes('access_token=') ||
                       hash.includes('id_token=') || hash.includes('error=') ||
                       hash.includes('state=');
            } catch { return false; }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Se estamos dentro do popup do MSAL, deixa o MSAL processar o retorno
            // e fechar o popup. Não inicializa a UI/app da página.
            if (estaDentroDoPopupMsal()) {
                try {
                    if (typeof msal !== 'undefined') {
                        const instanciaPopup = new msal.PublicClientApplication(window.msalConfig);
                        await instanciaPopup.initialize();
                        await instanciaPopup.handleRedirectPromise();
                    }
                } catch (e) { console.warn('popup MSAL: handleRedirectPromise', e && e.message); }
                return;
            }
            // NÃO zerar window.BACKEND_URL aqui: isso anulava o resolverBackendUrl()
            // acima e disparava "BACKEND_URL_NOT_CONFIGURED" ("Backend não configurado")
            // no login. Mantém o valor já resolvido (localStorage > Cloud Run padrão).
            window.BACKEND_URL = window.BACKEND_URL || resolverBackendUrl();
            window.FIREBASE_PROJECT_HOST = 'normatel-rh.firebaseapp.com'; window.FIREBASE_API_KEY = 'AIzaSyCWLQteC_iYmUi_0DVEsUb5kCdki5e13bs';
            registrarEventoBackend('acesso_pagina');
            sessionStorage.removeItem('rh_firebase_pending_login_check'); sessionStorage.removeItem('rh_firebase_pending_register');
            definirBotoesAuthHabilitados(false);
            if (typeof firebase !== 'undefined') document.getElementById('registerBtn').disabled = false;
            try {
                if (typeof msal !== 'undefined') {
                    msalInstance = new msal.PublicClientApplication(window.msalConfig);
                    await msalInstance.initialize();
                    msalReady = true;
                    console.log('account-selector: msal initialized', msalInstance, msalReady);
                    definirBotoesAuthHabilitados(true); limparMensagem();
                    const processouRetornoMsal = await processarRetornoLoginMicrosoft();
                    if (processouRetornoMsal) return;
                }
            } catch (initError) { console.error('❌ Falha ao inicializar MSAL:', initError); definirMensagem(`❌ Falha ao iniciar login Microsoft: ${initError.message}`, 'error'); }
            try { await processarRetornoConsultaFirebase(); } catch {}
            try { await processarRetornoCadastroFirebase(); } catch {}
            const temSessao = await verificarSessaoExistente();
            if (temSessao) limparMensagem();
            const emailAtual = localStorage.getItem('rh_user_email') || '';
            if (emailAtual) await aplicarRestricaoCadastroParaAprovado(emailAtual);
            if (typeof msal !== 'undefined' || typeof firebase !== 'undefined') definirBotoesAuthHabilitados(true);
            const btnLogin = document.getElementById('loginBtn');
            const btnRegister = document.getElementById('registerBtn');
            if (btnLogin) btnLogin.addEventListener('click', () => fazerLoginMicrosoft('login'));
            if (btnRegister) btnRegister.addEventListener('click', () => fazerLoginMicrosoft('cadastro'));
        });
    </script>
</body>
